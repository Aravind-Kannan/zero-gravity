zerops:
  - setup: ingestor
    build:
      base: nodejs@22
      buildCommands:
        - npm install
      deployFiles:
        - .
    run:
      base: nodejs@22
      envVariables:
        REDIS_URL: ${cache_connectionString}
        REDIS_HOST: ${cache_hostname}
        REDIS_PORT: ${cache_port}
        REDIS_PASSWORD: ${cache_password}
      start: node index.js
